name: jobs
# Jobs-only scan between the full syncs, so a new posting reaches the inbox (and the phone) within ~10 minutes.
# Supabase pg_cron dispatches it at :17, :27, :47 and :57 (migration 0011); sync.yml covers :07 and :37.
# Shares the sync concurrency group: the two never run at once, so the scan state can't be overwritten.
on:
  workflow_dispatch:
concurrency:
  group: sync
  cancel-in-progress: false
permissions: { contents: read }
jobs:
  jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: worker/pyproject.toml }
      - run: pip install -e .
      - run: python -m lockin_worker --only jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LOCKIN_OWNER_ID: ${{ secrets.LOCKIN_OWNER_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
