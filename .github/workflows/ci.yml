name: ci
on: [push, pull_request]
jobs:
  worker:
    runs-on: ubuntu-24.04  # Playwright has no Chromium build for Ubuntu 26 yet (ubuntu-latest moved 2026-10-19)
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: worker/pyproject.toml }
      - run: pip install -e '.[dev]'
      - run: pytest -q
  web:
    runs-on: ubuntu-24.04  # Playwright has no Chromium build for Ubuntu 26 yet (ubuntu-latest moved 2026-10-19)
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env: { CI: "true" }
