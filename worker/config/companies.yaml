# One entry per company board. Every token below was checked against the live board.
#   ats:   greenhouse | lever | ashby | workday | smartrecruiters | eightfold | oracle
#          | amazon | google | apple | meta | ibm (their own sites)
#   token: the board slug from the careers URL
#          workday: "<tenant>.<wdN>/<site>" from https://<tenant>.<wdN>.myworkdayjobs.com/<site>
#          eightfold: "<host>/<domain>", e.g. apply.careers.microsoft.com/microsoft.com
#          oracle: "<host>/<site>/<US location id>" (Oracle Recruiting Cloud)
#          amazon / google / apple / meta / ibm: their own sites; the token is just the name
#   tier:  reach   = top startups, FAANG and Apple: sort first in Jobs, high-priority push, engineer outreach before applying
#          volume  = large companies with big new-grad programs (and everyone else)
#          midwest = Midwest-headquartered employers. Any non-reach posting located in the Midwest
#                    (IL, MI, OH, IN, WI, MN, IA, MO) is tagged midwest too, whatever the company's tier.
#   aliases: other names the company goes by in the application Sheet, e.g. [JPMorgan, JP Morgan]
#   Proprietary trading firms, market makers and quant funds are not watched (filters.yaml `companies.exclude`).
#   software_only: the title must also look like software work (filters.yaml `role`).
#          On by default for workday and smartrecruiters; set it for hardware-heavy companies.
companies:
