  - { name: Netflix,   ats: eightfold, token: explore.jobs.netflix.net/netflix.com, tier: reach }
  - { name: Uber,      ats: oracle,    token: iaziqy.fa.ocs.oraclecloud.com/CX_1/300000000484560, tier: reach }
  - { name: JPMorgan Chase, ats: oracle, token: jpmc.fa.oraclecloud.com/CX_1001/300000000289738, tier: volume, aliases: [JPMorgan, JP Morgan, J.P. Morgan, JPMC] }
  - { name: Qualcomm,  ats: eightfold, token: careers.qualcomm.com/qualcomm.com, tier: volume }
