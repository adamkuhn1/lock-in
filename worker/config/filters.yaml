# Title filters for company boards (Greenhouse / Lever / Ashby).
# Python regexes, case-insensitive, OR-ed together. A posting alerts if its
# title matches ANY include pattern and NO exclude pattern.
# Excludes always win over includes.
# GitHub lists (config/lists.yaml) apply only the excludes unless
# `apply_include: true` is set — those lists are already early-career.
title:
  include:
    - '\bnew[- ]?grad(uate)?s?\b'
    - '\b2027\b'
    - '\bearly[- ]career\b'
    - '\buniversity[- ]grad(uate)?s?\b'
    - '\bentry[- ]level\b'
    - '\bsoftware engineer,?\s+(i|1)\b'      # "Software Engineer I", not II / Infra
    - '\bco-?op\b'
    - '\bwinter\b'
    - '\bspring\b'
    - '\bintern(s|ship|ships)?\b'           # not "internal" / "international"
    # Entry-level titles that skip the words above
    - '\bjunior\b|\bjr\b\.?'
    - '\bassociate\b(?=.*\b(engineer|developer|programmer)\b)'   # "Associate Software Engineer"; Director / Manager / Principal are excluded below
    - '\b(engineer|developer|programmer|scientist),?\s+(i|1)\b'   # "Software Development Engineer I", "Data Engineer 1", not II
    - '\bgraduate (software|engineer|developer|program|technology)'  # "Graduate Software Engineer"; "graduate student" is excluded
    - '\b(new )?college grad(uate)?s?\b'
    - '\brotation(al)? (program|engineer)'
    - '\bapprentice(ship)?\b'

  exclude:
    - '\bsenior\b'
    - '\bstaff\b'
    - '\bprincipal\b'
    - '\bmanager\b'
    - '\bph\.?d\b'

    # --- Bachelor's students only: drop advanced-degree roles ---
    # Never a bare "master" (Scrum Master, Master Data Engineer stay allowed).
    - '🎓'                                   # Simplify's "advanced degree required" marker
    # Titles that also welcome bachelor's candidates ("Bachelor's or Master's") stay allowed.
    - '^(?!.*\bbachelor).*\bmaster[''’]?s\b'  # Master's / Masters / Master’s (needs the s)
    - '^(?!.*\bbachelor).*\bmasters?\s+(degree|student|program)'  # "Master degree", "Masters program"
    - '^(?!.*\bbachelor).*\bmaster of (science|engineering)\b'
    - '^(?!.*\bbachelor).*\bdoctorate\b'
    - '^(?!.*\bbachelor).*\bpost-?grad(uate)?\b'
    - '\bms\s*/\s*ph\.?d\b'                # MS/PhD (also caught by the PhD rule)
    - '\bm\.?s\.?\s*/\s*ph'                 # M.S./PhD variants; never plain "ms"
    - '\bgraduate student'                  # grad-student researcher roles
    - '\bdoctoral\b'
    - '\bpost-?doc'                          # postdoc / post-doctoral / postdoctoral
    - '\bsr\b\.?'
    - '\b(engineer|developer|scientist|analyst),?\s+(ii|iii|iv|2|3)\b'   # mid-level; community lists include these

    # --- No Summer 2027 internships ---
    # Summer internships / co-ops / "Summer Analyst"-style programs, unless the
    # title also offers winter/spring (keeps "Software Engineer, Intern (Summer
    # or Winter)"). Full-time new grad roles with a summer start are NOT affected.
    - '^(?!.*\b(winter|spring)\b)(?=.*\b(intern(s|ship|ships)?|co-?op|summer (analyst|associate)s?)\b).*\bsummer\b'
    # Internships that don't name a term. In practice these are almost always
    # summer, so an intern title must mention winter, spring or co-op to alert.
    # For SimplifyJobs rows the Terms column counts as part of the title.
    - '^(?!.*\b(winter|spring|co-?op)\b).*\bintern(s|ship|ships)?\b'

    # added beyond the original list — catches e.g. "Head of Early Career Recruiting"
    - '\bhead of\b'
    - '\bdirector\b'
    - '\bvp\b'

    # --- Not software roles: these early-career tracks show up at every company ---
    - '\bmba\b'
    - '\bsales\b|\baccount (executive|manager|representative)\b|\bbusiness development\b'
    - '^(?!.*\b(engineer|developer|software)\b).*\bmarketing\b'
    - '^(?!.*\b(engineer|developer|software)\b).*\bdesign(er)?\b'   # keeps "Software Design Engineer"
    - '\brecruit(er|ing|ment)\b'
    - '\b(legal|counsel|paralegal)\b'
    - '\b(accountant|accounting|tax|audit)\b'
    - '\bstrategist\b'
    # Hardware-only and support tracks at big employers (IBM posts eight cities of "Hardware Developer")
    - '^(?!.*\bsoftware\b).*\b(hardware|hw)\b'
    - '\btechnical support\b'
    # Security-clearance roles (CTJ = Clearance Jobs, Poly = polygraph, TS/SCI): out of reach for a new grad
    - '\bctj\b|\bpoly(graph)?\b|\bts\s*/\s*sci\b|\b(security )?clearance (required|needed)\b|\bactive (secret|ts) clearance\b'

# Software-ish work. Required only for companies marked `software_only` in
# companies.yaml (on by default for Workday and SmartRecruiters boards), where
# early-career titles also cover hardware, manufacturing, finance and so on.
role:
  include:
    - '\bsoftware\b'
    - '\bdevelop(er|ment engineer)\b'
    - '\bswe\b'
    - '\bsde\b'
    - '\b(full|front|back)[- ]?end\b|\bfull[- ]?stack\b'
    - '\bweb\b'
    - '\b(mobile|ios|android)\b'
    - '\bdata (engineer|scien|analy)'
    - '\bmachine learning\b|\bml\b|\bai\b|\bdeep learning\b'
    - '\b(cloud|platform|infrastructure|systems?) engineer'
    - '\bdevops\b|\bsite reliability\b|\bsre\b'
    - '\b(cyber ?)?security engineer|\bcybersecurity\b'
    - '\bcomputer (science|engineer)'
    - '\bprogramm(er|ing)\b'
    - '\btechnology (development )?program\b|\btdp\b'
    - '\b(product|solutions|forward[- ]deployed) engineer'
    - '\bquant(itative)? (developer|engineer|research)'

# Where the job is. Checked against the posting's location plus any office /
# country info the job board provides (see job_radar/location.py).
location:
  us_only: true
  # Postings that give no usable location at all ("Remote", "Hybrid", blank).
  # allow = still alert (the alert shows the location so you can judge);
  # block = drop them.
  unknown: allow
  # US jobs here alert first, at high priority, with a ⭐.
  # Choices: nyc, chicago, texas, california
  preferred: [nyc, chicago, texas, california]
